spring:
  profiles:
    default: local

  application:
    name: CodeArena

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework: INFO
