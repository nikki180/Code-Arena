spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/coding_platform}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:1234}}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

app:
  jwt:
    # Local-development key only. Production requires JWT_SECRET.
    secret: ${JWT_SECRET:CodeArenaLocalOnlySecretChangeThisBeforeProduction123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: DEBUG
